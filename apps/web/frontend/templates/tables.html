{% extends "base.html" %}
{% set active = "tables" %}
{% block title %}Tables{% endblock %}
{% block content %}
<main class="max-w-4xl mx-auto p-4 md:p-6">
    <section class="space-y-3">
        <h1 class="text-2xl font-bold">Tables</h1>
        <p class="text-sm text-base-content/70">A table is a set of column definitions plus the papers extracted under them, their reviews and the knowledge learned from them.</p>
        <div id="list" class="space-y-3"><div class="skeleton h-24 w-full"></div></div>
    </section>

</main>
{% endblock %}
{% block scripts %}
<script>
(function () {
    const {$, esc, enc, get, when} = EVS;

    async function load() {
        const r = await get('/api/tables');
        if (!r.success) { $('list').innerHTML = `<div class="alert alert-error">${esc(r.error)}</div>`; return; }
        if (!r.tables.length) { $('list').innerHTML = '<div class="alert">No table yet.</div>'; return; }
        $('list').innerHTML = r.tables.map((t) => `<a href="/tables/${enc(t.id)}" class="card bg-base-100 shadow hover:shadow-lg transition block">
            <div class="card-body p-4">
                <div class="flex flex-wrap items-center gap-2"><h2 class="text-lg font-semibold">${esc(t.name)}</h2>
                    <span class="badge ${t.status === 'locked' ? 'badge-success' : 'badge-warning'}">${t.status === 'locked' ? 'locked' : 'draft'}</span>
                    ${t.locked_versions.length ? `<span class="badge badge-outline">v${t.locked_versions.join(', v')}</span>` : ''}</div>
                <div class="text-sm text-base-content/70">${t.fields} columns · ${t.papers} papers</div>
                <div class="text-xs text-base-content/50">created ${esc(when(t.created_at))}</div>
            </div></a>`).join('');
    }

    load();
})();
</script>
{% endblock %}
