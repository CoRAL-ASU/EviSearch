# Fly.io config for the EviSearch web demo. Deploy steps: README "Deploying the demo (Fly.io)".
# App names are global on Fly; change `app` if this one is taken.
app = "evisearch-demo"
primary_region = "ord"  # Chicago: close to Vertex us-central1, where every Gemini call goes

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"  # canary/bluegreen don't work with volumes

[env]
  EVISEARCH_PRESET = "cloud"        # Fly has no GPUs; Gemini + OpenAI embeddings
  EVISEARCH_RUNTIME_ROOT = "/data"  # uploads/results/embeddings/feedback live on the volume
  GOOGLE_CLOUD_LOCATION = "us-central1"
  # Secrets (fly secrets set): VERTEX_API_KEY, OPENAI_API_KEY, VISION_AGENT_API_KEY,
  # EVISEARCH_DEMO_PASSWORD (enables HTTP Basic auth; user defaults to "evisearch").

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"  # idle machine stops; next request starts it again
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options]
    idle_timeout = 600  # extraction/QA progress streams can go quiet for minutes between events

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# One machine only: the volume attaches to one machine and running jobs are tracked in memory.
[[mounts]]
  source = "evisearch_data"
  destination = "/data"
  initial_size = "5gb"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
